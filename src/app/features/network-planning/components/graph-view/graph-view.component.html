<div #container class="graph"></div>
@if (resolvedOptions.enableToolBar) {
  <div class="graph-toolbar">
    <button type="button" aria-label="Zoom in" (click)="zoomIn()">+</button>

    <button type="button" aria-label="Zoom out" (click)="zoomOut()">−</button>

    <button type="button" aria-label="Reset view" (click)="resetCamera()">
      ↻
    </button>
  </div>
}
