<section class="dashboard-card benchmark-configuration">
  <h2>1. Benchmark configuration</h2>

  <div class="benchmark-configuration__grid">
    <label class="field">
      <span>Algorithm</span>

      <select>
        <option>Automatic</option>
        <option>DSATUR (naive)</option>
        <option>DSATUR (heap)</option>
      </select>
    </label>

    <label class="field">
      <span>Number of transmitters</span>

      <input type="number" min="1" value="5000" />
    </label>

    <label class="field">
      <span>Interference radius</span>

      <div class="input-with-unit">
        <input type="number" min="1" value="60" />

        <span>m</span>
      </div>
    </label>

    <button
      type="button"
      class="button button--primary benchmark-configuration__run"
    >
      <span>▶</span>
      Run benchmark
    </button>
  </div>
</section>
