<form
  [formRoot]="configurationForm"
  class="dashboard-card benchmark-configuration control-form"
>
  <h2>1. Benchmark configuration</h2>

  <section class="benchmark-configuration__grid">
    <label class="field">
      <span>Algorithm</span>

      <select aria-label="Algorithm" [formField]="configurationForm.algorithm">
        @for (option of algorithmOptions; track option.id) {
          <option [value]="option.id">{{ option.label }}</option>
        }
      </select>
    </label>

    <label class="field">
      <span for="transmitters">Number of transmitters</span>

      <input
        id="transmitters"
        type="number"
        step="1"
        [formField]="configurationForm.transmitters"
      />
    </label>

    <label class="field">
      <span for="approximate-size">Approximate number of edges</span>

      <div class="input-with-unit">
        <input
          id="approximate-size"
          type="number"
          step="1"
          [formField]="configurationForm.approximateSize"
        />
      </div>
    </label>
    <button
      type="submit"
      class="button button--primary benchmark-configuration__run"
      [disabled]="configurationForm().invalid()"
      (click)="onClickRunBenchmark()"
    >
      <span aria-hidden="true">▶</span>
      Run benchmark
    </button>
  </section>

  <section
    class="benchmark-configuration__grid benchmark-configuration__grid--errors"
  >
    <app-field-errors
      class="approximate-size-error"
      [field]="configurationForm.approximateSize()"
    />
  </section>
</form>
