<article>
  <form [formRoot]="configurationForm" class="control-form">
    <h2>Network configuration</h2>

    <div class="mode-tabs">
      <button class="mode-tabs__button active">Generate</button>

      <button class="mode-tabs__button">Custom</button>

      <button class="mode-tabs__button">Import</button>
    </div>

    <section class="field">
      <div class="field__header">
        <label for="transmitters"> Number of transmitters </label>

        <output class="field__value">
          {{ configurationForm.transmitters().value() }}</output
        >
      </div>

      <input
        id="transmitters"
        type="range"
        [formField]="configurationForm.transmitters"
      />
    </section>

    <section class="field">
      <div class="field__header">
        <label for="radius"> Interference radius (m) </label>

        <output class="field__value">
          {{ configurationForm.interferenceRadius().value() }}</output
        >
      </div>

      <input
        id="radius"
        type="range"
        [formField]="configurationForm.interferenceRadius"
      />
    </section>

    <section class="field">
      <label for="distribution"> Distribution </label>

      <select id="distribution" [formField]="configurationForm.distribution">
        <option value="uniform">Random (uniform)</option>
        <option value="grid">Grid</option>
      </select>
    </section>

    <button
      type="button"
      class="button button--primary button--compact button--full run-button"
      (click)="onClickGenerateNetwork()"
    >
      Generate network
    </button>
  </form>

  <form [formRoot]="allocationForm" class="control-form">
    <h2>Algorithm</h2>

    <section class="field">
      <select aria-label="Algorithm" [formField]="allocationForm.algorithm">
        @for (option of algorithmOptions; track option.id) {
          <option [value]="option.id">{{ option.label }}</option>
        }
      </select>
    </section>

    <button
      type="button"
      class="button button--primary button--compact button--full run-button"
      (click)="onClickRunAllocation()"
    >
      <span class="run-button__icon" aria-hidden="true">▷</span>
      Run allocation
    </button>

    <button
      type="button"
      class="button button--primary button--compact button--full run-button"
      (click)="onClickReset()"
    >
      Reset
    </button>
  </form>
</article>
