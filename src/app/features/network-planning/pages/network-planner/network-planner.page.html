<div class="planner-shell">
  <main class="planner">
    <!-- LEFT PANEL -->
    <aside class="planner-controls">
      <app-planner-controls
        (generateNetwork)="onGenerateNetwork($event)"
        (runAllocation)="onRunAllocation($event)"
      ></app-planner-controls>
    </aside>

    <!-- GRAPH AREA -->
    <section class="planner-workspace">
      <div class="graph-stage hero-graph">
        <div class="graph-canvas">
          @if (networkGraph(); as graph) {
          <app-graph-view
            [graph]="graph"
            [options]="plannerGraphOptions"
            (rendered)="onGraphRendered()"
          />
          }
        </div>

        <!-- GRAPH CONTROLS -->
        <div class="graph-toolbar">
          <button class="graph-toolbar__button" aria-label="Zoom in">+</button>

          <button class="graph-toolbar__button" aria-label="Zoom out">−</button>

          <button class="graph-toolbar__button" aria-label="Reset camera">
            ⟳
          </button>
        </div>
      </div>

      <!-- STATS -->
      <footer class="planner-stats">
        <div class="stat">
          <span class="stat__label"> Transmitters </span>

          <strong class="stat__value"> 2,500 </strong>
        </div>

        <div class="stat">
          <span class="stat__label"> Edges </span>

          <strong class="stat__value"> 18,431 </strong>
        </div>

        <div class="stat">
          <span class="stat__label"> Frequencies </span>

          <strong class="stat__value"> 7 </strong>
        </div>

        <div class="stat">
          <span class="stat__label"> Runtime </span>

          <strong class="stat__value"> 83 ms </strong>
        </div>

        <div class="stat">
          <span class="stat__label"> Valid coloring </span>

          <strong class="stat__value stat__value--success">
            <span class="valid-icon">✓</span>
            Yes
          </strong>
        </div>
      </footer>
    </section>
  </main>

  <app-loading [loading]="loading()">
    <p>Generating network...</p>
  </app-loading>

  <app-warning-dialog
    [open]="showNoGraphWarning()"
    (close)="showNoGraphWarning.set(false)"
    title="Unable to run allocation"
  >
    Generate a network before running the frequency allocation algorithm.
  </app-warning-dialog>
</div>
