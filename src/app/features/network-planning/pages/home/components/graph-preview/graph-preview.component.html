<div class="graph-preview">
  @for (edge of renderedEdges; track edge.id) {
    <div
      class="edge"
      [style.left.%]="edge.x"
      [style.top.%]="edge.y"
      [style.width.%]="edge.length"
      [style.transform]="'rotate(' + edge.angle + 'deg)'"
      [style.animation-delay.s]="edge.animationDelay"
    ></div>
  }

  @for (node of nodes; track node.id) {
    <div
      class="node"
      [style.left.%]="node.x"
      [style.top.%]="node.y"
      [style.animation-delay.s]="node.animationDelay"
    ></div>
  }
</div>
