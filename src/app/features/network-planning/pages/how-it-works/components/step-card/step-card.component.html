<article class="step-card">
  <header class="step-card__header">
    <span class="step-card__number">{{ stepNumber() }}</span>

    <div>
      <h3>{{ title() }}</h3>
      <p>{{ description() }}</p>
    </div>
  </header>

  <div class="step-card__figure">
    <img [src]="imgUrl()" alt="{{ title() }}" />
  </div>

  <div class="step-card__content">
    <p>
      {{ content() }}
    </p>
  </div>
</article>
